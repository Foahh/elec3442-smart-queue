[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-queue"
version = "0.1.0"
description = "Smart queue length and wait time estimator backend for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.3",
    "pydantic-settings>=2.13.1",
    "sqlmodel>=0.0.37",
    "opencv-python-headless>=4.13",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.4.36",
]

[project.optional-dependencies]
pi = [
    "picamera2",
    "sense-hat",
]

[project.scripts]
smart-queue = "main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["config", "database", "db_models", "main", "schemas"]

# PyPI serves CUDA-enabled torch on Linux; Raspberry Pi needs CPU wheels from PyTorch.
# https://docs.astral.sh/uv/guides/integration/pytorch/
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
