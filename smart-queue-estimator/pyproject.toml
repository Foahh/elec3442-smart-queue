[project]
name = "smart-queue-estimator"
version = "0.1.0"
description = "Smart queue length and wait time estimator backend for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.2",
    "loguru>=0.7.3",
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "pydantic-settings>=2.13.1",
    "sqlmodel>=0.0.37",
    "ultralytics>=8.4.30",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
pi = [
    "picamera2; platform_system == 'Linux' and (platform_machine == 'aarch64')",
    "sense-hat; platform_system == 'Linux' and (platform_machine == 'aarch64')",
]

[project.scripts]
queue-estimator = "queue_estimator.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = []
